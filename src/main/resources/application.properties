spring.application.name=backend

# HTTP port (can be overridden with the SERVER_PORT environment variable)
server.port=8080

# Actuator: expose only the health endpoint over HTTP -> GET /actuator/health
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# CORS: comma-separated list of origins allowed to call /api/**.
# Defaults cover the Expo web dev server (Metro on 8081, legacy webpack on 19006).
# Native Expo apps (iOS/Android) are not subject to CORS.
# Override with the PHARMASSIST_CORS_ALLOWED_ORIGINS environment variable.
pharmassist.cors.allowed-origins=http://localhost:8081,http://localhost:19006

# Local development: optionally load variables from a git-ignored .env file
# in the working directory (see .env.example). Real environment variables win.
spring.config.import=optional:file:.env[.properties]

# MySQL 8 datasource. The password has no default and must come from DB_PASSWORD.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3307/pharmassist}
spring.datasource.username=${DB_USERNAME:pharmassist}
spring.datasource.password=${DB_PASSWORD}

# JPA/Hibernate: schema is owned by Flyway; Hibernate only validates it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Flyway migrations: src/main/resources/db/migration (V<version>__<description>.sql)
spring.flyway.locations=classpath:db/migration
